name: Review attachment inspector regression

on:
  push:
    branches: [validation/review-target-inspector-6864]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: packages/cloud-client
      - run: npm ci
        working-directory: packages/product-ui
      - name: Test review-triggered PR context
        working-directory: frontend
        run: npm test -- src/renderer/components/SessionInspector.test.tsx -t 'review-triggered PR context'
      - name: Test inspector and review helpers
        working-directory: frontend
        run: npm test -- src/renderer/components/SessionInspector.test.tsx src/renderer/components/SessionInspector.remote.test.tsx src/renderer/lib/session-reviews.test.ts src/renderer/lib/pr-display.test.ts

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build frontend package
        working-directory: frontend
        env:
          AO_RELEASE_REPO: OllieinCanada/agent-orchestrator
        run: npm run build
